name: CI

on:
  push:
    branches: [main, master, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm --dir server build

      - name: Build web
        run: pnpm --dir web build

      - name: Test
        run: pnpm --dir server test

      - name: Typecheck web
        run: pnpm --dir web run typecheck

      - name: Build desktop
        run: pnpm --dir desktop build
